# On a version tag, everything a release is, from that one push:
#
#   check    the tag names the version in Cargo.toml and sits on main
#   crates   `just package`, cargo-semver-checks against crates.io, then
#            publish whichever of the three SDK crates is not on crates.io
#            at this version (so a rerun publishes nothing twice)
#   image    ghcr.io/ynishi/evalhub:<version> and :latest
#   release  a GitHub Release for the tag, notes from the merged PR
#
# crates.io is authenticated by Trusted Publishing (OIDC): the owner has
# registered this repository and workflow file for each crate, and no
# token is stored anywhere. That registration is per crate and needs the
# first version of each crate published by hand, which 0.1.0 was.
#
# The tag is the human gate. It is pushed by `deploy/release/tag.sh`
# (usually through `deploy/release/land.sh`), which checks the same two
# things `check` does before the push, so `check` failing here means the
# tag was made some other way. The hosted service is not deployed by this
# workflow; that is `fly deploy`, by hand (docs/hosting.md).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the GitHub Release
  packages: write   # ghcr.io
  id-token: write   # crates.io Trusted Publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  check:
    name: tag matches the manifest and is on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" Cargo.toml \
            || { echo "tag $GITHUB_REF_NAME but Cargo.toml is at $(grep -m1 '^version' Cargo.toml)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tagged commit $GITHUB_SHA is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  crates:
    name: SDK crates to crates.io
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just package
        run: just package
      - name: semver against the published versions
        # A break shipped under a patch or 0.x minor bump stops the
        # release here, before anything is published; the fix is a
        # higher version, not a flag.
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: evalhub-schema,evalhub-core,evalhub-query
      - name: which of the three are not published yet
        id: pending
        run: |
          pending=""
          for c in evalhub-schema evalhub-core evalhub-query; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "evalhub release workflow (github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/$c/$VERSION")
            case "$code" in
              200) echo "$c $VERSION is already on crates.io" ;;
              404) pending="$pending -p $c" ;;
              *)   echo "crates.io answered $code for $c"; exit 1 ;;
            esac
          done
          echo "args=$pending" >> "$GITHUB_OUTPUT"
      - name: crates.io token (Trusted Publishing)
        if: steps.pending.outputs.args != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish
        if: steps.pending.outputs.args != ''
        # One command for all pending crates: cargo orders them by
        # dependency and waits for each to be indexed before the next.
        run: cargo publish ${{ steps.pending.outputs.args }} --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  image:
    name: container image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [check, crates, image]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: notes from the merged pull request
        # The tag points at a merge commit; the PR that produced it is
        # the release's description. Without one (a tag on a direct
        # commit), GitHub's generated notes are used.
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --search "$GITHUB_SHA" \
            --json number,title,body --jq '.[0] // empty' > pr.json
          if [ -s pr.json ]; then
            {
              printf '%s (#%s)\n\n' "$(jq -r .title pr.json)" "$(jq -r .number pr.json)"
              jq -r .body pr.json
              printf '\n---\nSDK crates: '
              for c in evalhub-schema evalhub-core evalhub-query; do
                printf '[%s](https://crates.io/crates/%s/%s) ' "$c" "$c" "$VERSION"
              done
              printf '\nImage: `ghcr.io/%s:%s`\n' "$GITHUB_REPOSITORY" "$VERSION"
            } > notes.md
            echo "notes=--notes-file notes.md" >> "$GITHUB_ENV"
          else
            echo "notes=--generate-notes" >> "$GITHUB_ENV"
          fi
      - name: create the release (once)
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "evalhub $VERSION" $notes
          fi
