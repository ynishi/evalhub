# On a version tag: build the container image from the tagged commit and
# push it to GitHub Container Registry as ghcr.io/ynishi/evalhub:<version>
# and :latest. That image is how the application is distributed; the
# hosted service itself is deployed with `fly deploy` from the checkout
# (docs/hosting.md). crates.io publishing of the three SDK crates is not
# done here; it is a hand-typed `cargo publish` (see CONTRIBUTING.md), and
# the tag that triggers this workflow is pushed as part of that same
# release script.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
