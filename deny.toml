# cargo-deny configuration. Run `cargo deny check` (see CONTRIBUTING.md).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Our own crates are AGPL-3.0-only. Dependencies must be permissive or weak
# copyleft so that the combined work can be distributed under the AGPL.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "MIT-0",                 # borrow-or-share (via jsonschema)
    "CDLA-Permissive-2.0",   # webpki-roots: Mozilla root certificate data
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
