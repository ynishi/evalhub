[package]
name = "evalhub-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/evalhub-server"
readme.workspace = true
description = "evalhub HTTP API, auth, OpenAPI, embedded web UI, and the `evalhub` binary."
keywords.workspace = true
categories.workspace = true
default-run = "evalhub"
# The application, not the SDK. crates.io carries evalhub-schema,
# evalhub-core and evalhub-query; the server ships as the container image
# (`Dockerfile`), the way a web application is not uploaded to npm.
publish = false
# `include` is exhaustive and switches the gitignore filter off for
# packaging. It is here for one reason: `web-dist/` (the built UI) is
# gitignored, and this is the only way it reaches the `.crate` that
# `just package` inspects. Anything not listed does not ship, so a new
# top-level file needs a line here.
include = [
    "/src",
    "/tests",
    "/web-dist",
    "/build.rs",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
]

[lints]
workspace = true

[[bin]]
name = "evalhub"
path = "src/main.rs"

[dependencies]
evalhub-schema.workspace = true
evalhub-core.workspace = true
evalhub-query.workspace = true
evalhub-store.workspace = true
tokio.workspace = true
axum.workspace = true
axum-extra.workspace = true
aide.workspace = true
tower.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
clap.workspace = true
figment.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
schemars.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
hmac.workspace = true
subtle.workspace = true
base64.workspace = true
rand.workspace = true
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
insta.workspace = true
testcontainers-modules.workspace = true
# Integration tests seed rows the endpoints under test do not write yet
# (a confirmed attachment, for instance). The library never uses sqlx
# directly; the store owns every query.
sqlx.workspace = true
# The attachment tests upload to and download from the presigned URLs the
# hub hands out, which is the one thing no in-process call can stand in for.
reqwest.workspace = true
